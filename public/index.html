<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood AI Bot</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <header>
            <img src="mood-bot-icon.svg" class="header-icon" alt="Mood Bot Icon">
            <h1>Mood AI Bot</h1>
        </header>
        
        <div id="chat-container">
            <div id="chat-messages"></div>
            
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Type your message...">
                <button id="send-button">Send</button>
            </div>
        </div>
        
        <div id="mood-display">Mood: Not detected yet</div>
        <div id="language-display">Language: Not detected yet</div>
        
        <footer>
            <div id="status-indicator">Offline</div>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
