<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Bot head -->
  <circle cx="50" cy="50" r="45" fill="#3498db" />
  
  <!-- Bot face -->
  <circle cx="50" cy="50" r="35" fill="#f0f4f8" />
  
  <!-- Bot eyes -->
  <circle cx="35" cy="40" r="5" fill="#2c3e50" />
  <circle cx="65" cy="40" r="5" fill="#2c3e50" />
  
  <!-- Bot mouth - changes based on mood -->
  <path d="M35,60 Q50,70 65,60" stroke="#2c3e50" stroke-width="3" fill="none" />
  
  <!-- Bot antennas -->
  <line x1="50" y1="5" x2="50" y2="15" stroke="#3498db" stroke-width="4" />
  <circle cx="50" cy="5" r="3" fill="#e74c3c" />
  
  <!-- Mood indicators -->
  <circle cx="25" cy="75" r="5" fill="#e74c3c" />
  <circle cx="50" cy="80" r="5" fill="#f1c40f" />
  <circle cx="75" cy="75" r="5" fill="#2ecc71" />
</svg>